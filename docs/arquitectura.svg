<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">lp2_lotes — Arquitectura MVC + DAO</text>

  <!-- Entry point -->
  <rect x="385" y="60" width="200" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="485" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Lp2_lotes</text>
  <text x="485" y="97" text-anchor="middle" font-size="11" fill="#4b5563">main() → new ProyectoController()</text>
  <line x1="485" y1="106" x2="485" y2="183" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VISTA -->
  <rect x="20" y="150" width="250" height="450" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="34" y="172" font-size="13" font-weight="700" fill="#1d4ed8">vista</text>
  <rect x="40" y="185" width="210" height="300" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="145" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ProyectoUI</text>
  <text x="145" y="223" text-anchor="middle" font-size="11" fill="#6b7280">extends JDialog (Swing)</text>
  <line x1="40" y1="233" x2="250" y2="233" stroke="#bfdbfe"/>
  <g font-size="11.5" fill="#374151" font-family="Consolas, Menlo, monospace">
    <text x="55" y="256">txtCodigo</text>
    <text x="55" y="276">txtNombre</text>
    <text x="55" y="296">txtBuscar</text>
    <text x="55" y="326">btnNuevo</text>
    <text x="55" y="346">btnEditar</text>
    <text x="55" y="366">btnEliminar</text>
    <text x="55" y="386">btnGuardar</text>
  </g>
  <text x="55" y="420" font-size="11" fill="#6b7280">Componentes públicos,</text>
  <text x="55" y="436" font-size="11" fill="#6b7280">sin lógica de negocio</text>
  <rect x="40" y="525" width="210" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="145" y="549" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">tabla : JTable</text>
  <text x="145" y="566" text-anchor="middle" font-size="11" fill="#6b7280">muestra el listado</text>

  <!-- CONTROLADOR -->
  <rect x="360" y="150" width="250" height="300" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="374" y="172" font-size="13" font-weight="700" fill="#b45309">controlador</text>
  <rect x="380" y="185" width="210" height="245" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="485" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ProyectoController</text>
  <text x="485" y="223" text-anchor="middle" font-size="11" fill="#6b7280">implements ActionListener</text>
  <line x1="380" y1="233" x2="590" y2="233" stroke="#fde68a"/>
  <g font-size="11.5" fill="#374151" font-family="Consolas, Menlo, monospace">
    <text x="395" y="254">dao    : ProyectoDAO</text>
    <text x="395" y="272">gui    : ProyectoUI</text>
    <text x="395" y="290">modelo : TablaModel</text>
    <text x="395" y="308">accion : char N/M/E</text>
  </g>
  <line x1="380" y1="320" x2="590" y2="320" stroke="#fde68a"/>
  <g font-size="11.5" fill="#374151" font-family="Consolas, Menlo, monospace">
    <text x="395" y="342">listar(valor)</text>
    <text x="395" y="360">getSeleccionFila(e)</text>
    <text x="395" y="378">getProyectoForm()</text>
    <text x="395" y="396">actionPerformed(e)</text>
  </g>

  <!-- Vista <-> Controlador -->
  <line x1="380" y1="262" x2="252" y2="262" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="255" text-anchor="middle" font-size="10.5" fill="#374151">lee / escribe</text>
  <line x1="250" y1="350" x2="378" y2="350" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="315" y="343" text-anchor="middle" font-size="10.5" fill="#374151">eventos</text>

  <!-- modelo.tabla -->
  <rect x="360" y="490" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="374" y="512" font-size="13" font-weight="700" fill="#047857">modelo.tabla</text>
  <rect x="380" y="525" width="210" height="55" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="485" y="549" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ProyectoTablaModel</text>
  <text x="485" y="566" text-anchor="middle" font-size="11" fill="#6b7280">extends AbstractTableModel</text>
  <line x1="485" y1="430" x2="485" y2="523" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="475" font-size="10.5" fill="#374151">setLista(List&lt;Proyecto&gt;)</text>
  <line x1="380" y1="552" x2="252" y2="552" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="545" text-anchor="middle" font-size="10.5" fill="#374151">setModel()</text>

  <!-- MODELO -->
  <rect x="700" y="150" width="280" height="380" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="714" y="172" font-size="13" font-weight="700" fill="#047857">modelo</text>

  <rect x="720" y="185" width="240" height="50" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="840" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Proyecto</text>
  <text x="840" y="223" text-anchor="middle" font-size="11" fill="#6b7280">entidad: id, nombre</text>

  <rect x="720" y="275" width="240" height="50" rx="6" fill="#ffffff" stroke="#10b981" stroke-dasharray="4 3"/>
  <text x="840" y="294" text-anchor="middle" font-size="10.5" fill="#6b7280">«interface»</text>
  <text x="840" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ProyectoDAO</text>

  <rect x="720" y="365" width="240" height="50" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="840" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ProyectoDAOImpl</text>
  <text x="840" y="403" text-anchor="middle" font-size="11" fill="#6b7280">SQL con PreparedStatement</text>

  <rect x="720" y="455" width="240" height="50" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="840" y="476" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Conexion</text>
  <text x="840" y="493" text-anchor="middle" font-size="11" fill="#6b7280">DriverManager.getConnection()</text>

  <line x1="840" y1="365" x2="840" y2="327" stroke="#374151" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#realize)"/>
  <line x1="840" y1="415" x2="840" y2="453" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="365" x2="840" y2="365" stroke="none"/>
  <text x="850" y="438" font-size="10.5" fill="#374151">conectar()</text>

  <!-- Controlador -> DAO -->
  <line x1="590" y1="300" x2="718" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="654" y="282" text-anchor="middle" font-size="10.5" fill="#374151">listado()</text>
  <text x="654" y="294" text-anchor="middle" font-size="10.5" fill="#374151">insertar() modificar()</text>

  <!-- DAOImpl usa Proyecto -->
  <path d="M960,390 C985,390 985,210 962,210" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- DB -->
  <line x1="840" y1="505" x2="840" y2="593" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="560" font-size="10.5" fill="#374151">JDBC</text>
  <g>
    <path d="M770,605 L770,665 A70,14 0 0 0 910,665 L910,605" fill="#e5e7eb" stroke="#6b7280"/>
    <ellipse cx="840" cy="605" rx="70" ry="14" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="840" y="643" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">PostgreSQL</text>
    <text x="840" y="660" text-anchor="middle" font-size="11" fill="#4b5563">db fcyt · tabla proyectos</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#374151">
    <line x1="30" y1="640" x2="60" y2="640" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="68" y="644">llamada / dependencia</text>
    <line x1="30" y1="662" x2="60" y2="662" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="68" y="666">evento Swing (listener)</text>
    <line x1="230" y1="640" x2="260" y2="640" stroke="#374151" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#realize)"/>
    <text x="268" y="644">implementa interfaz</text>
    <text x="230" y="666">Java 25 · Maven · Swing · postgresql 42.7.12</text>
  </g>
</svg>
